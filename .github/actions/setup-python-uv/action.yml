name: Setup Python with uv
description: Install uv and sync the project's Python environment for testing.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install

    - name: Sync dependencies
      shell: bash
      run: uv sync --locked --all-extras
